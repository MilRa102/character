[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Must stay >= the MSRV of `rig`, otherwise the MSRV-aware resolver downgrades it.
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/MilRa102/character"
publish = false

[workspace.dependencies]
character-actions = { path = "crates/character-actions" }
character-brain = { path = "crates/character-brain" }
character-core = { path = "crates/character-core" }
character-memory = { path = "crates/character-memory" }
character-types = { path = "crates/character-types" }
character-ui = { path = "crates/character-ui" }
character-voice = { path = "crates/character-voice" }
character-watch = { path = "crates/character-watch" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
libcosmic = { git = "https://github.com/pop-os/libcosmic", rev = "95236a944bfd51c63a2fc65fe50a592c47168d40", default-features = false, features = ["wayland", "tokio"] }
rig = "0.46"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
